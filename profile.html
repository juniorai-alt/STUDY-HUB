<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - UNBORN STUDIES</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
    }
   .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #2a2a35;
      margin-bottom: 30px;
    }
   .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
    }
   .logo-icon {
      width: 28px;
      height: 28px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
   .logo.unborn { color: #10b981; }
   .back-btn {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
   .profile-card {
      background: #1a1a24;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
   .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #000;
      margin: 0 auto 16px;
    }
   .user-email {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
   .user-meta {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 24px;
    }
   .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
   .stat-box {
      background: #0a0a0f;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
   .stat-number {
      font-size: 24px;
      font-weight: 800;
      color: #10b981;
    }
   .stat-label {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
   .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #2a2a35;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 10px;
    }
   .btn-danger {
      background: #ef444420;
      color: #ef4444;
      border: 1px solid #ef4444;
    }
   .btn:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">📚</div>
        <div><span class="unborn">UNBORN</span> STUDIES</div>
      </div>
      <a href="unborn-studies.html" class="back-btn">← Back to Studies</a>
    </header>

    <div class="profile-card">
      <div class="avatar" id="avatar">U</div>
      <div class="user-email" id="profileEmail">Loading...</div>
      <div class="user-meta" id="joinDate">Member since...</div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-number" id="watchlistCount">0</div>
          <div class="stat-label">Saved Resources</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="watchedCount">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>

      <button class="btn" onclick="changePassword()">Change Password</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAOiDtN_PWKerMLKqSe10eshBCW4UUvUFE",
      authDomain: "studies-9fe36.firebaseapp.com",
      databaseURL: "https://studies-9fe36-default-rtdb.firebaseio.com",
      projectId: "studies-9fe36",
      storageBucket: "studies-9fe36.firebasestorage.app",
      messagingSenderId: "343910673142",
      appId: "1:343910673142:web:3849a63bfbbbcb94811ad7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profileEmail').textContent = user.email;
      document.getElementById('avatar').textContent = user.email[0].toUpperCase();

      const joinDate = new Date(user.metadata.creationTime);
      document.getElementById('joinDate').textContent = `Member since ${joinDate.toLocaleDateString()}`;

      const watchlistRef = ref(db, `users/${user.uid}/watchlist`);
      const snapshot = await get(watchlistRef);
      if (snapshot.exists()) {
        document.getElementById('watchlistCount').textContent = Object.keys(snapshot.val()).length;
      }
    });

    window.changePassword = function() {
      const user = auth.currentUser;
      if (user?.email) {
        sendPasswordResetEmail(auth, user.email);
        alert('Password reset link sent to ' + user.email);
      }
    }

    window.logout = function() {
      signOut(auth).then(() => {
        window.location.href = 'login.html';
      });
    }
  </script>
</body>
  </html>
